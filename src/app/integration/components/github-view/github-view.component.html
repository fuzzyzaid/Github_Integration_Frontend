<div class="container">

  <div class="actions-container">

  <button mat-stroked-button color="warn" (click)="removeIntegration()" [disabled]="removing || resyncing">
    Remove Integration
  </button>

  <button mat-stroked-button color="accent" (click)="resyncIntegration()" [disabled]="removing || resyncing">
    Re-sync Integration
  </button>

</div>
<div *ngIf="removing || resyncing" class="loader-wrapper">
    <mat-spinner diameter="40"></mat-spinner>
    <p>{{ removing ? 'Removing…' : 'Re-syncing…' }}</p>
</div>

  <!-- FILTER BAR -->
  <div class="filter-bar">

    <mat-form-field appearance="outline">
      <mat-label>Integration</mat-label>
      <mat-select [(value)]="selectedIntegration" disabled>
        <mat-option *ngFor="let i of integrations" [value]="i.value">{{ i.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Entity</mat-label>
      <mat-select [(value)]="selectedEntity" (selectionChange)="onEntityChange($event.value)">
        <mat-option *ngFor="let e of entities" [value]="e.value">{{ e.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field *ngIf="selectedEntity !== 'github_orgs'" appearance="outline">
      <mat-label>Org</mat-label>
      <input matInput [(ngModel)]="orgLogin" (input)="onFilterOrgApply(orgLogin)" placeholder="org">
    </mat-form-field>

    <mat-form-field *ngIf="['github_repos','github_commits','github_pulls','github_issues','github_issue_events'].includes(selectedEntity)" appearance="outline">
      <mat-label>Repo</mat-label>
      <input matInput [(ngModel)]="repoName" (input)="onFilterRepoApply(repoName)" placeholder="repo">
    </mat-form-field>

    <mat-form-field appearance="outline" class="search-box">
      <mat-label>Search</mat-label>
      <input matInput [(ngModel)]="search" (input)="onSearchChange(search)" placeholder="search everything">
    </mat-form-field>

  </div>

  <!-- GRID -->
  <div class="grid-wrapper" [class.loading]="loading">

     <div *ngIf="loading" class="loader-wrapper">
        <mat-spinner diameter="60"></mat-spinner>
        <p class="loader-text">Loading GitHub data...</p>
     </div>

     <div class="grid-wrapper" *ngIf="!loading">
         <ag-grid-angular
          class="ag-theme-alpine"
          [rowData]="rowData"
          [columnDefs]="columnDefs"
          [pagination]="false"
          [animateRows]="true" 
          [defaultColDef]="defaultColDef"
          [domLayout]="'autoHeight'">
        </ag-grid-angular>
     </div>
     
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">

    <!-- Left: Pagination -->
    <div class="pagination-left">
      <span>{{ rangeStart }}–{{ rangeEnd }} of {{ total }}</span>

      <button mat-icon-button (click)="goFirst()" [disabled]="page <= 1">«</button>
      <button mat-icon-button (click)="goPrev()" [disabled]="page <= 1">‹</button>

      <span class="page-info">Page {{ page }} / {{ totalPages }}</span>

      <button mat-icon-button (click)="goNext()" [disabled]="page >= totalPages">›</button>
      <button mat-icon-button (click)="goLast()" [disabled]="page >= totalPages">»</button>

      <mat-form-field appearance="outline" class="page-size">
        <mat-label>Per page</mat-label>
        <mat-select [(value)]="pageSize" (selectionChange)="onPageSizeChange($event.value)">
          <mat-option [value]="30">30</mat-option>
          <mat-option [value]="50">50</mat-option>
          <mat-option [value]="100">100</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Right: Sort controls -->
    <div class="sort-right" *ngIf="availableSortFields?.length">
      <mat-form-field appearance="outline" class="sort-dropdown">
        <mat-label>Sort by</mat-label>
        <mat-select [(value)]="sortBy" (selectionChange)="onSortChange(sortBy, sortDir)">
          <mat-option *ngFor="let f of availableSortFields" [value]="f">{{ f }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-button-toggle-group [(ngModel)]="sortDir" (change)="onSortChange(sortBy, sortDir)">
        <mat-button-toggle value="asc">Asc</mat-button-toggle>
        <mat-button-toggle value="desc">Desc</mat-button-toggle>
      </mat-button-toggle-group>
    </div>

  </div>

</div>
