<div style="text-align:center; margin-top:50px;">
  <h2>GitHub Integration</h2>

  <button mat-raised-button color="primary" (click)="connectGithub()" [disabled]="connected" style="margin-bottom:25px;">
    Connect to GitHub
  </button>

  <div *ngIf="connected" style="margin-bottom:25px; color:green;">
    ✅ Connected on {{ connectedDate | date:'short' }} <br>
    {{ username }} <br>
    <img [src]="avatar" alt="avatar" width="50"> <br>
    <span *ngIf="lastSyncedAt">Last synced: {{ lastSyncedAt | date:'short' }}</span>
  </div>

  <mat-expansion-panel *ngIf="connected" style="margin-top:30px;">
    <mat-expansion-panel-header>
      <mat-panel-title>Integration Actions</mat-panel-title>
    </mat-expansion-panel-header>

    <div style="display:flex; justify-content:center; gap:20px; margin-top:15px;">
      <button mat-stroked-button color="warn" (click)="removeIntegration()">Remove Integration</button>
      <button mat-stroked-button color="accent" (click)="resyncIntegration()">Re-sync Integration</button>
    </div>
  </mat-expansion-panel>
</div>
