<div class="integration-container">
  <h2 class="integration-title">GitHub Integration</h2>

  <button mat-raised-button color="primary"
          (click)="connectGithub()"
          [disabled]="connected"
          class="connect-btn">
    Connect to GitHub
  </button>

  <div *ngIf="connected" class="status-container">
    <div class="status-left">
      <p class="status-line">
        ✅ Connected on {{ connectedDate | date:'short' }}
        <span *ngIf="lastSyncedAt"> | Last synced: {{ lastSyncedAt | date:'short' }}</span>
      </p>
    </div>
    <div class="status-right">
      <img [src]="avatar" alt="avatar" class="avatar">
      <div class="username">{{ username }}</div>
    </div>
  </div>

  <mat-expansion-panel *ngIf="connected"
                       class="integration-panel"
                       (opened)="onPanelOpened()"
                       (closed)="onPanelClosed()">
    <mat-expansion-panel-header>
      <mat-panel-title class="panel-title">Integration Actions</mat-panel-title>
    </mat-expansion-panel-header>

    <div class="actions-container">
      <button mat-stroked-button color="warn" (click)="removeIntegration()">Remove Integration</button>
      <button mat-stroked-button color="accent" (click)="resyncIntegration()">Re-sync Integration</button>
    </div>

    <app-github-view *ngIf="showGithubView" [username]="username"></app-github-view>
  </mat-expansion-panel>
</div>
