<div style="text-align:center; margin-top:50px;">
  <h2>GitHub Integration</h2>
  <button mat-raised-button color="primary" (click)="connectGithub()" [disabled]="connected">
    Connect to GitHub
  </button>

  <div *ngIf="connected" style="margin-top:20px; color:green;">
    ✅ Connected on {{ connectedDate | date:'short' }}
    <br>
    {{ username }}
    <img [src]="avatar" alt="avatar" width="50">
  </div>
</div>
